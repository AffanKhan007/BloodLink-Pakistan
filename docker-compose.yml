services:
  db:
    image: postgres:16-alpine
    container_name: bloodlink-postgres
    environment:
      POSTGRES_DB: blood_app
      POSTGRES_USER: blood_user
      POSTGRES_PASSWORD: blood_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bloodlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blood_user -d blood_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: bloodlink-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - bloodlink-network

  worker:
    build:
      context: ./backend
    container_name: bloodlink-worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python -m app.worker"
    networks:
      - bloodlink-network

  scheduler:
    build:
      context: ./backend
    container_name: bloodlink-scheduler
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python -m app.scheduler"
    networks:
      - bloodlink-network

  frontend:
    build:
      context: ./frontend
    container_name: bloodlink-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - bloodlink-network

  redis:
    image: redis:8-alpine
    container_name: bloodlink-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bloodlink-network

  minio:
    image: minio/minio:latest
    container_name: bloodlink-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bloodlink-network

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  minio_data:

networks:
  bloodlink-network:
    driver: bridge
