services:
  db:
    image: postgres:16-alpine
    container_name: bloodlink-postgres
    environment:
      POSTGRES_DB: blood_app
      POSTGRES_USER: blood_user
      POSTGRES_PASSWORD: blood_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bloodlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blood_user -d blood_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: bloodlink-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - bloodlink-network

  frontend:
    build:
      context: ./frontend
    container_name: bloodlink-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - bloodlink-network

volumes:
  postgres_data:
  uploads_data:

networks:
  bloodlink-network:
    driver: bridge

